name: lab11

topology:
  kinds:
    arista_ceos:
      binds:
        - int-mapping.json:/mnt/flash/EosIntfMapping.json:ro
      env:
        CLAB_MGMT_VRF: MGMT
      image: ceos:4.36.0.1F
  nodes:
    leaf1:
      kind: arista_ceos
      startup-config: startup-configs/leaf1.cfg
    leaf2:
      kind: arista_ceos
      startup-config: startup-configs/leaf2.cfg
    spine1:
      kind: arista_ceos
      startup-config: startup-configs/spine1.cfg
    spine2:
      kind: arista_ceos
      startup-config: startup-configs/spine2.cfg
    leaf3:
      kind: arista_ceos
      startup-config: startup-configs/leaf3.cfg
    leaf4:
      kind: arista_ceos
      startup-config: startup-configs/leaf4.cfg
  links:
    [
      { endpoints: [ "leaf1:eth3", "spine1:eth3" ] },
      { endpoints: [ "leaf1:eth4", "spine2:eth3" ] },
      { endpoints: [ "leaf2:eth3", "spine1:eth4" ] },
      { endpoints: [ "leaf2:eth4", "spine2:eth4" ] },
      { endpoints: [ "leaf4:eth3", "spine1:eth6" ] },
      { endpoints: [ "leaf4:eth4", "spine2:eth6" ] },
      { endpoints: [ "leaf3:eth3", "spine1:eth5" ] },
      { endpoints: [ "leaf3:eth4", "spine2:eth5" ] }
    ]
