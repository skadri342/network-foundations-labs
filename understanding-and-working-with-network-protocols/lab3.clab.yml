name: lab3

topology:
  kinds:
    arista_ceos:
      binds:
        - int-mapping.json:/mnt/flash/EosIntfMapping.json:ro
      env:
        CLAB_MGMT_VRF: MGMT
      image: ceos:4.36.0.1F
  nodes:
    leaf1:
      kind: arista_ceos
      startup-config: startup-configs/leaf1.cfg
    leaf2:
      kind: arista_ceos
      startup-config: startup-configs/leaf2.cfg
    leaf3:
      kind: arista_ceos
      startup-config: startup-configs/leaf3.cfg
    leaf4:
      kind: arista_ceos
      startup-config: startup-configs/leaf4.cfg
    spine1:
      kind: arista_ceos
      startup-config: startup-configs/spine1.cfg
    spine2:
      kind: arista_ceos
      startup-config: startup-configs/spine2.cfg
    spine3:
      kind: arista_ceos
      startup-config: startup-configs/spine3.cfg
    spine4:
      kind: arista_ceos
      startup-config: startup-configs/spine4.cfg
    host1:
      kind: arista_ceos
      startup-config: startup-configs/host1.cfg
    host3:
      kind: arista_ceos
      startup-config: startup-configs/host3.cfg
  links:
    [
      { endpoints: [ "leaf1:eth1", "leaf2:eth1" ] },
      { endpoints: [ "leaf1:eth2", "leaf2:eth2" ] },
      { endpoints: [ "leaf3:eth1", "leaf4:eth1" ] },
      { endpoints: [ "leaf3:eth2", "leaf4:eth2" ] },
      { endpoints: [ "spine1:eth1", "spine2:eth1" ] },
      { endpoints: [ "spine1:eth2", "spine2:eth2" ] },
      { endpoints: [ "spine3:eth1", "spine4:eth1" ] },
      { endpoints: [ "spine3:eth2", "spine4:eth2" ] },
      { endpoints: [ "leaf1:eth3", "spine1:eth3" ] },
      { endpoints: [ "leaf2:eth3", "spine1:eth4" ] },
      { endpoints: [ "leaf3:eth3", "spine1:eth5" ] },
      { endpoints: [ "leaf4:eth3", "spine1:eth6" ] },
      { endpoints: [ "leaf1:eth4", "spine2:eth3" ] },
      { endpoints: [ "leaf2:eth4", "spine2:eth4" ] },
      { endpoints: [ "leaf3:eth4", "spine2:eth5" ] },
      { endpoints: [ "leaf4:eth4", "spine2:eth6" ] },
      { endpoints: [ "leaf1:eth5", "spine3:eth3" ] },
      { endpoints: [ "leaf2:eth5", "spine3:eth4" ] },
      { endpoints: [ "leaf3:eth5", "spine3:eth5" ] },
      { endpoints: [ "leaf4:eth5", "spine3:eth6" ] },
      { endpoints: [ "leaf1:eth6", "spine4:eth3" ] },
      { endpoints: [ "leaf2:eth6", "spine4:eth4" ] },
      { endpoints: [ "leaf3:eth6", "spine4:eth5" ] },
      { endpoints: [ "leaf4:eth6", "spine4:eth6" ] },
      { endpoints: [ "host1:eth1", "leaf1:eth7" ] },
      { endpoints: [ "host1:eth2", "leaf2:eth7" ] },
      { endpoints: [ "host3:eth1", "leaf3:eth7" ] },
      { endpoints: [ "host3:eth2", "leaf4:eth7" ] }
    ]
